<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomahawk 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>html,body{margin:0;height:100%;background:#0d0d0e}model-viewer{width:100%;height:100%;--poster-color:transparent}
.hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font:12px ui-monospace,Consolas,monospace;color:#8e8e93;pointer-events:none}</style></head>
<body><model-viewer src="model/tomahawk.glb" alt="Modelo 3D del misil Tomahawk" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500" rotation-per-second="18deg"
camera-orbit="-35deg 72deg 62%" field-of-view="26deg" min-camera-orbit="auto auto 25%" shadow-intensity="0.9" exposure="0.85" environment-image="neutral" interaction-prompt="none"></model-viewer>
<div class="hint">arrastra para girar · rueda o pellizco para acercar</div></body></html>
